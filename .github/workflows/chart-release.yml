name: Chart Release

on:
  push:
    tags:
      - "imp-list-chart-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CHART_OCI_REF: oci://registry-1.docker.io/powerofcreation

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🏷️ Determine trigger tag
        id: trigger
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛠️ Install git-cliff
        if: steps.trigger.outputs.tag == ''
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: git-cliff

      # Only runs for workflow_dispatch (no trigger tag). Just computes and
      # reserves the version string - the tag itself isn't created until
      # "🚀 Create draft release" (via --target, only if it doesn't already
      # exist), so a failed run up to and including the OCI push never
      # leaves a dangling tag with no release behind it.
      - name: 🔖 Compute next version
        if: steps.trigger.outputs.tag == ''
        id: bump
        run: |
          set -euo pipefail
          NEXT_TAG=$(git-cliff --config charts/imp-list/cliff.toml --bumped-version)
          if [ -n "$(git ls-remote --tags origin "refs/tags/${NEXT_TAG}")" ]; then
            echo "::error::Refusing to create release for already-existing tag ${NEXT_TAG}"
            exit 1
          fi
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Resolve release tag/version
        id: release
        run: |
          set -euo pipefail
          TAG="${{ steps.trigger.outputs.tag }}${{ steps.bump.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#imp-list-chart-v}" >> "$GITHUB_OUTPUT"

      - name: 📝 Generate changelog (charts/imp-list/** commits only)
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: charts/imp-list/cliff.toml
          args: --latest --tag ${{ steps.release.outputs.tag }} --strip header

      - name: 🛠️ Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      # Login early so a Docker Hub auth failure fails fast, before the
      # (slower) kind/smoke-test steps run.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Package chart
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IMAGE_TAG=$(yq '.backend.image.tag' charts/imp-list/values.yaml)
          helm package charts/imp-list --version "$VERSION" --app-version "$IMAGE_TAG" -d dist/
          echo "path=dist/imp-list-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: 🔎 helm lint (packaged artifact)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          helm lint "$CHART_PATH" \
            --set backend.secret.databaseUrl=x --set backend.secret.keycloakIssuer=x --set backend.secret.keycloakClientId=x

      - name: 🛠️ Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: 🐘 Deploy ephemeral Postgres into kind
        run: |
          set -euo pipefail
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
                env:
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    value: smoke
                  - name: POSTGRES_DB
                    value: todos
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "postgres"]
                  initialDelaySeconds: 2
                  periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
          EOF
          kubectl wait --for=condition=Ready pod/postgres --timeout=60s

      - name: 🔥 Smoke test (helm install + helm test against the packaged chart)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          # KEYCLOAK_ISSUER points at the real, shared, hosted SSO instance
          # (never run locally, see AGENTS.md) - same one the backend image's
          # own smoke test uses.
          helm install imp-list-smoke "$CHART_PATH" \
            --set backend.secret.databaseUrl="host=postgres user=postgres password=smoke dbname=todos port=5432 sslmode=disable" \
            --set backend.secret.keycloakIssuer="https://sso.ops.light-dev-solutions.de/realms/user-apps" \
            --set backend.secret.keycloakClientId="shopping-list" \
            --wait --timeout 90s
          helm test imp-list-smoke --logs

      - name: Smoke test debug info on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pod -l app.kubernetes.io/instance=imp-list-smoke || true
          kubectl logs -l app.kubernetes.io/instance=imp-list-smoke --all-containers --tail=200 || true
          kubectl logs pod/postgres --tail=100 || true

      - name: 🧹 Tear down smoke test release
        if: always()
        run: helm uninstall imp-list-smoke || true

      - name: 🚢 Push chart (OCI)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: helm push "$CHART_PATH" "$CHART_OCI_REF"

      - name: 🚀 Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          {
            echo "## imp-list chart ${VERSION}"; echo
            echo "**Chart:** \`${CHART_OCI_REF}/imp-list:${VERSION}\`"; echo
            echo "### Pull"; echo '```'
            echo "helm pull ${CHART_OCI_REF}/imp-list --version ${VERSION}"; echo '```'; echo
            echo "### Changelog"; echo
            echo "$CHANGELOG"
          } > notes.md

          # --target creates the tag (only if missing) together with this
          # release, so a failure before this point never leaves a dangling
          # tag. Draft, not published - stays mutable so asset upload below
          # can retry/clobber even with immutable releases enabled.
          n=1; max=5
          until gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --draft \
            --title "imp-list chart ${TAG}" \
            --notes-file notes.md \
            --target "${{ github.sha }}"; do
            [ "$n" -ge "$max" ] && { echo "::error::release create failed after $max attempts"; exit 1; }
            echo "::warning::release create failed (attempt $n/$max), retrying in $((n * 5))s"
            sleep "$((n * 5))"; n=$((n + 1))
          done

      - name: 📤 Upload chart asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          n=1; max=5
          until gh release upload "$TAG" "$CHART_PATH" --clobber; do
            [ "$n" -ge "$max" ] && { echo "::error::asset upload failed after $max attempts"; exit 1; }
            echo "::warning::asset upload failed (attempt $n/$max), retrying in $((n * 5))s"
            sleep "$((n * 5))"; n=$((n + 1))
          done

      - name: ✅ Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
