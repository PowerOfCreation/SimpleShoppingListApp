name: Chart Release

on:
  push:
    tags:
      - "imp-list-chart-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [rc, stable]
        default: rc
      version:
        description: 'Version (e.g. 1.2.0); empty = conventional-commit bump since last stable'
        type: string
        required: false

env:
  CHART_OCI_REF: oci://registry-1.docker.io/powerofcreation

concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🛠️ Install git-cliff
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: git-cliff

      # The tag itself isn't created until "🚀 Create draft release" (via
      # --target, only if it doesn't already exist), so a failed run up to
      # and including the OCI push never leaves a dangling tag with no
      # release behind it.
      - name: 🧮 Resolve release tag/version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          TAG_PREFIX: imp-list-chart-v
          CLIFF_CONFIG: charts/imp-list/cliff.toml
        run: bash scripts/release-version.sh

      - name: 📝 Generate changelog (charts/imp-list/** commits only)
        id: changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          config: charts/imp-list/cliff.toml
          args: --latest --tag ${{ steps.release.outputs.tag }} --strip header

      - name: 🛠️ Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Login early so a Docker Hub auth failure fails fast, before the
      # (slower) kind/smoke-test steps run.
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Package chart
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IMAGE_TAG=$(yq '.backend.image.tag' charts/imp-list/values.yaml)
          helm package charts/imp-list --version "$VERSION" --app-version "$IMAGE_TAG" -d dist/
          echo "path=dist/imp-list-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: 🔎 helm lint (packaged artifact)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          helm lint "$CHART_PATH" \
            --set backend.secret.databaseUrl=x --set backend.keycloak.issuer=x --set backend.keycloak.clientId=x

      - name: 🛠️ Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: 🐘 Deploy ephemeral Postgres into kind
        run: |
          set -euo pipefail
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
                env:
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    value: smoke
                  - name: POSTGRES_DB
                    value: todos
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "postgres"]
                  initialDelaySeconds: 2
                  periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
          EOF
          kubectl wait --for=condition=Ready pod/postgres --timeout=60s

      - name: 🔥 Smoke test (helm install + helm test against the packaged chart)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          # KEYCLOAK_ISSUER points at the real, shared, hosted SSO instance
          # (never run locally, see AGENTS.md) - same one the backend image's
          # own smoke test uses.
          helm install imp-list-smoke "$CHART_PATH" \
            --set backend.secret.databaseUrl="host=postgres user=postgres password=smoke dbname=todos port=5432 sslmode=disable" \
            --set backend.keycloak.issuer="https://sso.ops.light-dev-solutions.de/realms/user-apps" \
            --set backend.keycloak.clientId="shopping-list" \
            --wait --timeout 90s
          helm test imp-list-smoke --logs

      - name: Smoke test debug info on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pod -l app.kubernetes.io/instance=imp-list-smoke || true
          kubectl logs -l app.kubernetes.io/instance=imp-list-smoke --all-containers --tail=200 || true
          kubectl logs pod/postgres --tail=100 || true

      - name: 🧹 Tear down smoke test release
        if: always()
        run: helm uninstall imp-list-smoke || true

      - name: 🚢 Push chart (OCI)
        id: push
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          PUSH_OUTPUT=$(helm push "$CHART_PATH" "$CHART_OCI_REF")
          echo "$PUSH_OUTPUT"
          DIGEST=$(printf '%s\n' "$PUSH_OUTPUT" | sed -n 's/^Digest: //p' | tail -n1)
          if [ -z "$DIGEST" ]; then
            echo "::error::Could not determine chart digest from helm push output"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
          CHART_DIGEST: ${{ steps.push.outputs.digest }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## imp-list chart ${VERSION}"; echo
            echo "**Chart:** \`${CHART_OCI_REF}/imp-list:${VERSION}\`"; echo
            echo "**Digest:** \`${CHART_DIGEST}\`"; echo
            echo "### Pull"; echo '```'
            echo "helm pull ${CHART_OCI_REF}/imp-list --version ${VERSION}"; echo '```'; echo
            echo "### Show values"; echo '```'
            echo "helm show values ${CHART_OCI_REF}/imp-list --version ${VERSION}"; echo '```'; echo
            echo "### Changelog"; echo
            echo "$CHANGELOG"
          } > notes.md

          # --target creates the tag (only if missing) together with this
          # release, so a failure before this point never leaves a dangling
          # tag. Draft, not published - stays mutable so asset upload below
          # can retry/clobber even with immutable releases enabled.
          n=1; max=5
          until gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --draft \
            --title "imp-list chart ${TAG}" \
            --notes-file notes.md \
            --prerelease="$PRERELEASE" \
            --target "${{ github.sha }}"; do
            [ "$n" -ge "$max" ] && { echo "::error::release create failed after $max attempts"; exit 1; }
            echo "::warning::release create failed (attempt $n/$max), retrying in $((n * 5))s"
            sleep "$((n * 5))"; n=$((n + 1))
          done

      - name: 📤 Upload chart asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          n=1; max=5
          until gh release upload "$TAG" "$CHART_PATH" --clobber; do
            [ "$n" -ge "$max" ] && { echo "::error::asset upload failed after $max attempts"; exit 1; }
            echo "::warning::asset upload failed (attempt $n/$max), retrying in $((n * 5))s"
            sleep "$((n * 5))"; n=$((n + 1))
          done

      - name: ✅ Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
