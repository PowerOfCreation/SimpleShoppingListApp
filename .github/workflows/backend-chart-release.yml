name: Backend Chart Release

on:
  push:
    tags:
      - "backend-chart-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CHART_OCI_REF: oci://registry-1.docker.io/powerofcreation/charts

concurrency:
  group: backend-chart-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🏷️ Determine trigger tag
        id: trigger
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🛠️ Install git-cliff
        if: steps.trigger.outputs.tag == ''
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: git-cliff

      # Only runs for workflow_dispatch (no trigger tag). Just computes and
      # reserves the version string - the tag itself is created later, only
      # after the smoke test passes (see "🏷️ Create and push release tag"),
      # so a failed run never leaves a dangling tag with no release behind it.
      - name: 🔖 Compute next version
        if: steps.trigger.outputs.tag == ''
        id: bump
        run: |
          set -euo pipefail
          NEXT_TAG=$(git-cliff --config charts/backend/cliff.toml --bumped-version)
          if [ -n "$(git ls-remote --tags origin "refs/tags/${NEXT_TAG}")" ]; then
            echo "::error::Refusing to create release for already-existing tag ${NEXT_TAG}"
            exit 1
          fi
          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"

      - name: 🧮 Resolve release tag/version
        id: release
        run: |
          set -euo pipefail
          TAG="${{ steps.trigger.outputs.tag }}${{ steps.bump.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#backend-chart-v}" >> "$GITHUB_OUTPUT"

      - name: 📝 Generate changelog (charts/backend/** commits only)
        id: changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: charts/backend/cliff.toml
          args: --latest --tag ${{ steps.release.outputs.tag }} --strip header

      - name: 🛠️ Install Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: 📦 Package chart
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IMAGE_TAG=$(yq '.image.tag' charts/backend/values.yaml)
          helm package charts/backend --version "$VERSION" --app-version "$IMAGE_TAG" -d dist/
          echo "path=dist/backend-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: 🔎 helm lint (packaged version)
        run: |
          set -euo pipefail
          helm lint charts/backend \
            --set secret.databaseUrl=x --set secret.keycloakIssuer=x --set secret.keycloakClientId=x

      - name: 🛠️ Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: 🐘 Deploy ephemeral Postgres into kind
        run: |
          set -euo pipefail
          kubectl apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: postgres
            labels:
              app: postgres
          spec:
            containers:
              - name: postgres
                image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
                env:
                  - name: POSTGRES_USER
                    value: postgres
                  - name: POSTGRES_PASSWORD
                    value: smoke
                  - name: POSTGRES_DB
                    value: todos
                readinessProbe:
                  exec:
                    command: ["pg_isready", "-U", "postgres"]
                  initialDelaySeconds: 2
                  periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector:
              app: postgres
            ports:
              - port: 5432
          EOF
          kubectl wait --for=condition=Ready pod/postgres --timeout=60s

      - name: 🔥 Smoke test (helm install + helm test against the packaged chart)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          # KEYCLOAK_ISSUER points at the real, shared, hosted SSO instance
          # (never run locally, see AGENTS.md) - same one the backend image's
          # own smoke test uses.
          helm install backend-smoke "$CHART_PATH" \
            --set secret.databaseUrl="host=postgres user=postgres password=smoke dbname=todos port=5432 sslmode=disable" \
            --set secret.keycloakIssuer="https://sso.ops.light-dev-solutions.de/realms/user-apps" \
            --set secret.keycloakClientId="shopping-list" \
            --wait --timeout 90s
          helm test backend-smoke --logs

      - name: Smoke test debug info on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pod -l app.kubernetes.io/instance=backend-smoke || true
          kubectl logs -l app.kubernetes.io/instance=backend-smoke --all-containers --tail=200 || true
          kubectl logs pod/postgres --tail=100 || true

      - name: 🧹 Tear down smoke test release
        if: always()
        run: helm uninstall backend-smoke || true

      # Only runs for workflow_dispatch (no trigger tag) - and only once the
      # smoke test above has passed. Pushed with GITHUB_TOKEN, which does NOT
      # trigger a second run of this workflow.
      - name: 🏷️ Create and push release tag (only after a passing smoke test)
        if: steps.trigger.outputs.tag == ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚢 Push chart (OCI)
        env:
          CHART_PATH: ${{ steps.package.outputs.path }}
        run: helm push "$CHART_PATH" "$CHART_OCI_REF"

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHART_PATH: ${{ steps.package.outputs.path }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          set -euo pipefail
          {
            echo "## Backend chart ${VERSION}"; echo
            echo "**Chart:** \`${CHART_OCI_REF}/backend:${VERSION}\`"; echo
            echo "### Pull"; echo '```'
            echo "helm pull ${CHART_OCI_REF}/backend --version ${VERSION}"; echo '```'; echo
            echo "### Changelog"; echo
            echo "$CHANGELOG"
          } > notes.md
          n=1; max=5
          until gh release create "$TAG" \
            --title "Backend chart ${TAG}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            "$CHART_PATH"; do
            [ "$n" -ge "$max" ] && { echo "::error::gh release create failed after $max attempts"; exit 1; }
            echo "::warning::gh release create failed (attempt $n/$max), retrying in $((n * 5))s"
            sleep "$((n * 5))"; n=$((n + 1))
          done
