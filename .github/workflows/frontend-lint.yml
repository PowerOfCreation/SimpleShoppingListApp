name: Lint TS (eslint, prettier)

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-lint.yml"

jobs:
  lint:
    name: Lint TS (eslint, prettier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            frontend/

      - name: 📦 Setup Node and dependencies
        uses: ./.github/actions/setup-node-install

      - name: 🏃‍♂️ Run ESLint on PR
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-eslint@6dad10dc50476699ad1ddbbb19bf55d36f311a39 # v1.37.0
        with:
          workdir: frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "--ext .js,.jsx,.ts,.tsx"
          fail_level: warning

      # reviewdog only comments on changed lines; this gates the whole tree
      # and runs tsc, which otherwise never ran before merge.
      - name: 🏃‍♂️ Run ESLint + tsc
        run: pnpm run lint
        working-directory: ./frontend
