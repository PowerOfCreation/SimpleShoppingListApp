name: E2E Smoke (Maestro Android)

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/e2e-smoke.yml"
      - "frontend/**"

jobs:
  android-smoke:
    name: Android smoke test (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ☕ Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: 📦 Setup Node and dependencies
        uses: ./.github/actions/setup-node-install

      - name: 🧱 Build Android APK locally (no Expo cloud)
        working-directory: ./frontend
        env:
          # The emulator below only ever runs x86_64, so building the other three
          # ABIs is pure wasted CMake/NDK time. Restricting to what's actually
          # tested cuts the native-build portion of this step to roughly a
          # quarter without changing what the release-build path (unaffected
          # by this var) produces.
          CI_ANDROID_ARCH: x86_64
        run: |
          set -eux
          pnpm expo prebuild --platform android --clean --non-interactive
          cd android
          ./gradlew assembleRelease
          APK_PATH="$PWD/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Maestro CLI: downloaded from the release and only used if it matches the
      # pinned SHA256 (Renovate bumps both). Not via setup-maestro-cli (no checksum
      # check; Maestro releases are mutable) and no Docker image (none official).
      - name: Install Maestro CLI
        env:
          # renovate: datasource=github-release-attachments depName=mobile-dev-inc/Maestro
          MAESTRO_VERSION: cli-2.11.0
          MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: 🤖 Run Maestro smoke flow on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: |
            set -eux
            export MAESTRO_CLI_NO_ANALYTICS=1
            maestro --version
            adb install -r "$APK_PATH"
            maestro test frontend/.maestro/smoke.yml
