name: E2E Smoke (Maestro Android)

on:
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/e2e-smoke.yml"
      - "frontend/**"

jobs:
  android-smoke:
    name: Android smoke test (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ☕ Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 📦 Setup Node and dependencies
        uses: ./.github/actions/setup-node-install

      - name: 🧱 Build Android APK locally with EAS
        working-directory: ./frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euxo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          APK_PATH="$PWD/maestro-smoke.apk"
          pnpm dlx eas-cli@latest build \
            --platform android \
            --profile maestro-smoke \
            --local \
            --non-interactive \
            --output "$APK_PATH"
          test -f "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🤖 Run Maestro smoke flow on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: |
            set -euxo pipefail
            curl -fsSL "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro --version
            adb install -r "$APK_PATH"
            maestro test frontend/.maestro/smoke.yml
