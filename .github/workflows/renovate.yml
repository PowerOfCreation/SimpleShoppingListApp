name: Renovate

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 04:00 UTC
  workflow_dispatch:      # Allow manual runs

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate clones the repository itself and reads renovate.json5 from that
      # clone, so no checkout is needed. Don't pass that file as
      # configurationFile either: it would then double as global config, which is
      # what forced global-only options like repositories into it.
      - uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          renovate-version: 43.220.0@sha256:459b7e28aa54fa2fa7db83df6a2d6ad26de416a054ee554e7833203adf3d9a47
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          # Global-only option, so it lives here rather than in renovate.json5.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
