{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "imp-list.componentFullname" (dict "root" $ "component" "backend") }}
  labels:
    {{- include "imp-list.labels" (dict "root" $ "component" "backend" "version" .Values.backend.image.tag) | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "imp-list.selectorLabels" (dict "root" $ "component" "backend") | nindent 4 }}
{{- end }}
