{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "imp-list.componentFullname" (dict "root" $ "component" "backend") }}
  labels:
    {{- include "imp-list.labels" (dict "root" $ "component" "backend" "version" .Values.backend.image.tag) | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "imp-list.selectorLabels" (dict "root" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.backend.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/backend/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "imp-list.selectorLabels" (dict "root" $ "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          {{- if gt (int .Values.backend.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              # Native "sleep" action, not exec — the distroless app image has
              # no shell/sleep binary to exec into. Requires Kubernetes 1.29+
              # (stable since 1.32); on older clusters, set this to 0.
              sleep:
                seconds: {{ .Values.backend.preStopSleepSeconds }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            {{- if .Values.backend.logging.level }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.logging.level | quote }}
            {{- end }}
            {{- if .Values.backend.logging.format }}
            - name: LOG_FORMAT
              value: {{ .Values.backend.logging.format | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "imp-list.backend.secretName" . }}
                  key: {{ .Values.backend.secret.existingSecretKeys.databaseUrl }}
            - name: KEYCLOAK_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ include "imp-list.backend.secretName" . }}
                  key: {{ .Values.backend.secret.existingSecretKeys.keycloakIssuer }}
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "imp-list.backend.secretName" . }}
                  key: {{ .Values.backend.secret.existingSecretKeys.keycloakClientId }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
