{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "imp-list.fullname" . }}
  labels:
    {{- include "imp-list.commonLabels" (dict "root" $) | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- if .Values.host }}
  hostnames:
    - {{ .Values.host | quote }}
  {{- end }}
  rules:
    {{- if .Values.backend.enabled }}
    - matches:
        - path:
            type: {{ eq .Values.backend.route.pathType "Exact" | ternary "Exact" "PathPrefix" }}
            value: {{ .Values.backend.route.path | quote }}
      backendRefs:
        - name: {{ include "imp-list.componentFullname" (dict "root" $ "component" "backend") }}
          port: {{ .Values.backend.service.port }}
    {{- end }}
{{- end }}
