apiVersion: v1
kind: Pod
metadata:
  name: {{ include "backend.fullname" . }}-test-connection
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # The app image is distroless (no shell, no curl) — the test hook runs
  # from a separate curl image against the Service instead of exec-ing into
  # the app container.
  containers:
    - name: curl
      image: docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - "http://{{ include "backend.fullname" . }}:{{ .Values.service.port }}/healthz"
  restartPolicy: Never
