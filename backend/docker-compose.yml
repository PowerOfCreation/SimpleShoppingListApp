services:
  postgres:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres user=postgres password=postgres dbname=todos port=5432 sslmode=disable"
      # Same hosted Keycloak instance/client the frontend uses (never run
      # locally). Required - the API refuses to start without it.
      KEYCLOAK_ISSUER: "https://sso.ops.light-dev-solutions.de/realms/user-apps-dev"
      KEYCLOAK_CLIENT_ID: "shopping-list"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
