services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "host=postgres user=postgres password=postgres dbname=todos port=5432 sslmode=disable"
      # Same hosted Keycloak instance/client the frontend uses (never run
      # locally). Required - the API refuses to start without it.
      KEYCLOAK_ISSUER: "https://sso.ops.light-dev-solutions.de/realms/user-apps"
      KEYCLOAK_CLIENT_ID: "shopping-list"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
